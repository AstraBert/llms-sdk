build = "cargo build --release"
test = "cargo test --release --all-features"
integration = "cargo test --release --all-features --test integration_test -- --ignored"
test-no-fs = "cargo test --release --no-default-features"
clippy = "cargo clippy --all-features"
clippy-fix = "cargo clippy --all-features --fix --allow-dirty"
format = "cargo fmt --all -- --check"
format-fix = "cargo fmt --all"
