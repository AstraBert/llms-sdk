[package]
name = "llms-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
base64 = "0.22.1"
file-format = { version = "0.29.0" }
schemars = "1.2.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
clap = { version = "4.6.1", features = ["derive"], optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"], optional = true }
eventsource-stream = "0.2.3"
futures-util = "0.3"
futures-core = "0.3"
async-stream = "0.3.6"

[features]
default = ["fs"]
fs = []
cli = ["dep:clap", "dep:tokio"]

[[bin]]
name = "llms"
path = "src/main.rs"
required-features = ["cli", "fs"]
