name: CI - Rust

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/ci-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/ci-docs.yml"

jobs:
  docs-checks:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.9.0'


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.4.0'
          cache: 'pnpm'
          cache-dependenciy-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: docs/

      - name: Build
        run: pnpm run build
        working-directory: docs/

      - name: Lint
        run: pnpm run lint:docs
        working-directory: docs/

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: docs/
