[package]
name = "llms-sdk"
version = "0.1.3"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AstraBert/llms-sdk"
description = "Unified interface to call OpenAI and Anthropic-compatible LLM APIs from Rust"
keywords = ["llms", "ai", "sdk", "openai", "anthropic"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
base64 = "0.22.1"
file-format = { version = "0.29.0" }
schemars = "1.2.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
clap = { version = "4.6.1", features = ["derive"], optional = true }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"], optional = true }
eventsource-stream = "0.2.3"
futures-util = "0.3"
futures-core = "0.3"
async-stream = "0.3.6"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

[features]
default = ["fs"]
fs = []
cli = ["dep:clap", "dep:tokio"]

[[bin]]
name = "llms"
path = "src/main.rs"
required-features = ["cli", "fs"]
