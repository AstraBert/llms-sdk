
[package]
authors = ["Clelia Astra Bertelli"]
edition = "2021"
name = "llms-sdk-ts"
version = "0.1.0"


[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.0.0", features = ["serde-json", "async"] }
