
[package]
authors = ["Clelia Astra Bertelli"]
edition = "2021"
name    = "llms-sdk-ts"
version = "0.1.0"


[lib]
crate-type = ["cdylib"]

[dependencies]
base64       = "0.22.1"
file-format  = { version = "0.29.0" }
futures-util = "0.3"
llms-sdk     = { path = "../llms-sdk", version = "0.1.3" }
napi         = { version = "3.0.0", features = ["serde-json", "async"] }
napi-derive  = "3.0.0"
schemars     = "1.2.1"
serde_json   = "1.0.150"
url          = "2.5.8"

[build-dependencies]
napi-build = "2"
