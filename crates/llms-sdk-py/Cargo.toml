[package]
name = "llms-sdk-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "Unified interface to call OpenAI and Anthropic-compatible LLM APIs from Python"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "llms_sdk"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.28.3"
llms-sdk = { path = "../llms-sdk", version = "0.1.3" }
