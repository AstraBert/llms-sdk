[package]
name = "llms-sdk-py"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "Unified interface to call OpenAI and Anthropic-compatible LLM APIs from Python"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "llms_sdk"
crate-type = ["cdylib"]

[dependencies]
either = "1.17.0"
url = "2.5.8"
file-format = { version = "0.29.0" }
base64 = "0.22.1"
pyo3 = { version = "0.28.3", features = ["either"] }
llms-sdk = { path = "../llms-sdk", version = "0.1.3" }
pythonize = "0.28"
schemars = "1.2.1"
serde_json = "1.0.150"
